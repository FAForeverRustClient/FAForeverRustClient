<!doctype html>
<!-- No spelling check anywhere: what is typed here is mostly player, map and
     mod names, channels and game slang, all of which the dictionary marks as
     wrong. Every field inherits this unless it sets `spellCheck` itself. -->
<html lang="en" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- main.tsx points this at the same brand artwork as the native icon. -->
    <link rel="icon" type="image/svg+xml" />
    <title>FAForever Client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
