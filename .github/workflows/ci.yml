name: CI

# Guards the project's core invariant: no type drift across the Tauri boundary
# and no silent breakage. Runs on every push to the long-lived branches and on
# every PR. See ARCHITECTURE.md §3.6 (single IPC contract) and docs/PROJECT_GUIDE.md.

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust - test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src-tauri (forge-client) links against the system webview stack, so the
      # workspace build needs these even though the logic crates are pure.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Covers every workspace crate/all target and parses Rust, unlike the
        # old grep (which missed crates and matched comments).
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::print_stderr

  frontend:
    name: Frontend - lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm run architecture

      - name: No em dashes in source or project documentation
        run: |
          hits=$(grep -rnP '\x{2014}' crates ui/src src-tauri/src docs .github --include='*' || true)
          if [ -n "$hits" ]; then
            echo "::error::Em dashes are forbidden by AGENTS.md. Use punctuation appropriate to the sentence:"
            echo "$hits"
            exit 1
          fi

      - name: tsc --noEmit
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm run build

      # Tokens-only guardrail: components reference semantic tokens, never raw
      # hex. Theming lives in tokens.css alone, so a new theme never revisits a
      # component. Dependency-free analogue of the bindings-drift gate.
      - name: No hardcoded colors outside tokens.css
        run: |
          hits=$(grep -rnE '#[0-9a-fA-F]{3,8}\b' ui/src --include='*.css' | grep -v 'design-system/tokens.css' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded hex colors found outside tokens.css. Use a CSS variable:"
            echo "$hits"
            exit 1
          fi

  bindings-drift:
    name: Bindings drift check
    runs-on: ubuntu-latest
    # faf-ipc depends only on faf-domain + specta (no Tauri), so this job needs
    # no system libraries. It just regenerates the bindings and diffs them.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Regenerate TypeScript bindings
        run: cargo run -q -p faf-ipc --bin export-bindings

      - name: Fail if bindings are out of date
        run: |
          if ! git diff --exit-code ui/src/ipc/bindings.ts; then
            echo "::error file=ui/src/ipc/bindings.ts::Bindings are out of date. Run 'pnpm run bindings' and commit the result."
            exit 1
          fi

  reducer-conformance-drift:
    name: Reducer conformance fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Regenerate reducer conformance fixture
        run: |
          if ! git ls-files --error-unmatch ui/src/store/__fixtures__/reducer-conformance.json >/dev/null; then
            echo "::error file=ui/src/store/__fixtures__/reducer-conformance.json::Reducer conformance fixture is not tracked. Add it before relying on this job."
            exit 1
          fi
          cargo test -p faf-domain --test conformance_fixtures

      - name: Fail if the fixture is out of date
        run: |
          if ! git diff --exit-code ui/src/store/__fixtures__/reducer-conformance.json; then
            echo "::error file=ui/src/store/__fixtures__/reducer-conformance.json::Reducer conformance fixture is out of date. Run 'cargo test -p faf-domain --test conformance_fixtures' and commit the result."
            exit 1
          fi
