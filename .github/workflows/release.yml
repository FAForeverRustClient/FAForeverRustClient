name: Release

# Started by hand from the Actions tab. The version is not typed in: it comes
# from `src-tauri/tauri.conf.json`, and the tag `v<version>` is created by the
# build, so the thing that ships and the thing that names it cannot disagree.
#
# Not a push trigger on purpose. A version bump rides along in ordinary pull
# requests, and publishing to every user is not something a merge should do on
# its own.
#
# The release notes are not typed in either: every pull request leaves a
# snippet in `changelog/snippets`, and the ones added since the previous
# release are combined here (see changelog/README.md). A form field could not
# carry them anyway, because `workflow_dispatch` inputs are one line.
#
# The release is opened as a draft, the builds upload into it, and only when
# every desktop build has succeeded is it published; the Android job only has to
# have finished, and a release whose APK failed goes out without one. Publishing is the moment two
# things happen at once: clients are offered the update, and the release
# webhook fires, which is what the changelog bridge on Discord listens for
# (FAForeverRustClient/Client-Release-Changelog-Bridge, `action ==
# "published"`). The notes therefore have to be on the release before that
# moment; the bridge never sees an edit made afterwards.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        # This flag decides who is offered the release, not a label.
        # `pick_release` in `infra/client_update.rs` skips a prerelease for
        # anyone on the stable channel. So:
        #
        #   checked   - offered to players whose settings allow prereleases.
        #               That is the default, and a `false` stored under the
        #               old default is switched on once on load.
        #   unchecked - offered to every client.
        #
        # Either way an offer is a sidebar notice first, and becomes the update
        # gate three days after publishing or two releases behind (`is_overdue`
        # in the client-update slice), unless `required` below skips that.
        description: 'Mark as a prerelease: offered only to clients that allow prereleases (the default)'
        type: boolean
        default: true
      required:
        # For a security fix, or a change the server will not talk to older
        # clients without: every client behind this release on its channel
        # raises the update gate at once instead of after the grace period.
        # It works through a line put first in the notes, which players also
        # read on GitHub and Discord; the client looks for exactly this line
        # (`REQUIRED_UPDATE_LINE` in `protocol/changelog.rs`, whose test reads
        # this file).
        description: 'Required update: clients behind it must install it at once, without the grace period'
        type: boolean
        default: false
      allow_existing_tag:
        # A failed desktop build no longer needs this: nothing was published,
        # so the draft is still there and a plain re-run picks it up. A failed
        # Android build leaves a published release, which "Re-run failed jobs"
        # completes with its APK. This is for adding to a release that is
        # already out by a new run.
        description: 'Add to an already published release instead of refusing.'
        type: boolean
        default: false

# One release at a time: two runs share one draft, so a second run waits
# for the first to publish rather than mixing its assets into the same release.
concurrency:
  group: release
  cancel-in-progress: false

# Every third-party action below is pinned to a commit, not a tag. These jobs
# hold `contents: write` and build what every client installs, and a tag is a
# pointer its owner (or whoever takes over their account) can move to any
# commit at all. The comment after each pin names the release it was taken
# from; moving to a newer one is a deliberate edit of both.
jobs:
  prepare:
    name: Check the version and open the draft
    # The gate for the whole release: every later job needs this one. With a
    # required reviewer on the `release` environment (repository settings,
    # Environments), a dispatched run waits here until that person approves,
    # so write access to the repository alone no longer ships a client.
    # GitHub creates the environment on the first run that names it; until it
    # has a protection rule, this line changes nothing.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags, so an existing release is noticed before four builds run

      # The client's updater reads the version out of the tag, the in-app "about"
      # reads it out of the binary, and the frontend reads it out of package.json.
      # Three files that must agree, checked here rather than discovered by a user
      # whose client reports a version nobody released.
      - name: Read and cross check the version
        id: version
        run: |
          TAURI=$(jq -r '.version' src-tauri/tauri.conf.json)
          NODE=$(jq -r '.version' package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tauri.conf.json=$TAURI package.json=$NODE Cargo.toml=$CARGO"
          if [ "$TAURI" != "$NODE" ] || [ "$TAURI" != "$CARGO" ]; then
            echo "::error::Version mismatch. All three must agree before a release."
            exit 1
          fi
          # `is_release_version` in faf-domain accepts this shape and nothing
          # else, and it is what decides whether a client sees the release at all.
          if ! echo "$TAURI" | grep -Eq '^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$TAURI' is not a shape the client's updater accepts."
            exit 1
          fi
          echo "version=$TAURI" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse a tag
        if: ${{ !inputs.allow_existing_tag }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Bump the version, or re-run with allow_existing_tag to add to it."
            exit 1
          fi
          echo "$TAG is free"

      # The previous release is the newest `v*` tag behind this commit, never
      # this version's own: with allow_existing_tag that tag already exists,
      # and taking it would leave nothing to combine. The release command
      # requires one new highlights snippet with 3 to 7 player-facing bullets
      # before opening a draft or starting any platform builds.
      - name: Validate highlights and combine the changelog snippets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRED: ${{ inputs.required }}
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' --exclude "v$VERSION" HEAD 2>/dev/null || true)
          echo "Snippets added since ${PREVIOUS:-the beginning}"
          node scripts/changelog.mjs release $PREVIOUS > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog snippets were added since ${PREVIOUS:-the beginning}. See changelog/README.md."
            exit 1
          fi
          # No length limit here: the bridge posts the notes as the Discord
          # message itself and splits anything over Discord's 2000 characters
          # into follow-up messages in the same thread.
          printf '\n\nDownload the installer for your platform from the assets below.\n' >> release-notes.md
          if [ "$REQUIRED" = "true" ]; then
            {
              printf '%s\n\n' '**Required update.** Older versions of the client ask to install it right away.'
              cat release-notes.md
            } > release-notes.required.md
            mv release-notes.required.md release-notes.md
          fi
          cat release-notes.md

      # Finds a draft left behind by a run whose builds failed and builds into
      # it again, so a retry never leaves two drafts with the same tag. The
      # releases list is the only place a draft shows up: it has no tag yet,
      # so `releases/tags/<tag>` does not know it.
      - name: Open the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          EXISTING=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -1)
          if [ -z "$EXISTING" ]; then
            ID=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="FAForever Client $TAG" \
              -F body=@release-notes.md \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq .id)
            echo "Opened draft $ID for $TAG"
          else
            ID=${EXISTING% *}
            DRAFT=${EXISTING#* }
            if [ "$DRAFT" = "true" ]; then
              gh api -X PATCH "repos/$REPO/releases/$ID" \
                -f target_commitish="$GITHUB_SHA" \
                -F body=@release-notes.md \
                -F prerelease="$PRERELEASE" > /dev/null
              echo "Reusing draft $ID for $TAG, notes and commit refreshed"
            else
              # Only reachable with allow_existing_tag. Its notes already went
              # to Discord and are left as they are.
              echo "Adding to published release $ID for $TAG"
            fi
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build ${{ matrix.platform }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # No macOS. Forged Alliance itself does not run there, so a client that
        # cannot launch a game is not worth shipping, and the two jobs failed on
        # every release anyway: `prepare:native` has no ICE adapter jar and no
        # Java runtime for darwin, and Tauri will not bundle a resource that is
        # not on disk. Two lines to put back if that ever changes.
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        # Pinned, this action no longer reads the toolchain from its ref, so
        # it is named.
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # See the same step in ci.yml: a third-party apt source with a stale
          # index must not be able to fail a release. The install below stays
          # strict, so a package that really did not arrive still stops this.
          sudo grep -rlE 'dl[.]google[.]com|packages[.]microsoft[.]com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # No version here: package.json's `packageManager` field is the single
      # source, and passing both makes the action refuse to guess.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `beforeBuildCommand` is only the frontend bundle. The helpers the app
      # ships as resources (faf-uid, faf-pioneer, the JRE, the Java adapter) are
      # downloaded here, and without this step `natives/` is empty and they are
      # silently missing from the installer.
      - name: Prepare bundled helpers
        run: pnpm run prepare:native

      - name: Verify bundled Java runtime
        run: node scripts/check-java-runtime.mjs

      # linuxdeploy resolves the dependencies of every library in the AppImage,
      # the bundled JRE's included, and the JRE's own libraries need
      # `libjvm.so`, which sits in its `lib/server` where linuxdeploy does not
      # look: 0.9.1's first run failed with "Could not find dependency:
      # libjvm.so". On the search path it is found. linuxdeploy then also
      # copies one into `usr/lib`, which nothing loads (25 MB); the JRE's
      # libraries keep `$ORIGIN` and load their own, and the bundled java runs
      # the ICE adapter from the extracted AppImage (checked in a throwaway
      # workflow, 2026-10-16).
      - name: Let linuxdeploy find the bundled JRE's libjvm
        if: matrix.platform == 'ubuntu-22.04'
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/natives/jre/lib/server:$GITHUB_WORKSPACE/natives/jre/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the binary by `option_env!`, because a player running a
          # release has no such variables set and FAF Live could otherwise only
          # ever work in a developer's shell. Unset secrets expand to an empty
          # string, which is the existing "no credentials" path: the feature
          # stays silently off rather than the build failing. See
          # docs/streams.md for what these are and why they are not a secret
          # once shipped.
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        with:
          # Upload into the draft `prepare` opened. Its tag is `v<version>`,
          # because `strip_version_prefix` in faf-domain strips a leading `v`
          # and nothing else: a tag shaped any other way is invisible to the
          # client's own update check.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-android:
    name: Build Android
    needs: prepare
    # The signing key is kept as secrets of the `release` environment, not of
    # the repository: only a run approved for that environment can read it,
    # as `prepare` describes, while a repository secret is open to any
    # workflow run on any branch a writer pushes. GitHub asks the reviewer to
    # approve this job's deployment beside prepare's.
    environment: release
    # A hung Gradle or SDK step must not hold the desktop release: a timed-out
    # job is a failure, which `publish` lets through, while cancelling the run
    # would skip `publish` as well.
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # The release key, made once with keytool by the maintainers and kept only
      # in the `release` environment's secrets, base64-encoded: Android installs
      # an update only when it carries the installed app's key, so losing it
      # strands every installed copy. Without it the job builds nothing and the
      # release goes out without an APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # The NDK compiles the C in the dependency tree (zstd, ring and the like)
      # and links the library.
      NDK_VERSION: "29.0.14206865"
    steps:
      - name: Check for the release key
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: no Android build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.key.outputs.present == 'true'

      # The Gradle wrapper is a committed binary the build runs: it has to be
      # one of Gradle's own releases (checked against Gradle's checksums).
      - name: Validate the Gradle wrapper
        if: steps.key.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Rust stable with the Android target
        if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable, 2026-10
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Java
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the NDK
        if: steps.key.outputs.present == 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install frontend dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # `pnpm exec`, not `pnpm run tauri`: the package script first downloads
      # the desktop helpers (faf-uid, the ICE adapters, a Java runtime), which
      # an Android build has no use for.
      - name: Build the APK
        if: steps.key.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          pnpm exec tauri android build --apk --target aarch64 --ci
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload into the draft
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          NAME="FAForever.Client_${VERSION}_android_arm64.apk"
          # A rerun reuses the draft (prepare), which may already hold this APK
          # from the run before, and GitHub refuses a second asset of the same
          # name: the old one goes first, as tauri-action does with its own.
          OLD=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$NAME\") | .id")
          if [ -n "$OLD" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"
          fi
          gh api --method POST -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$NAME" \
            --input "$APK" --jq .browser_download_url

  publish:
    name: Publish the release
    # `needs` on a matrix job waits for every platform and fails if any did,
    # so a release missing a desktop installer is never offered to anybody.
    # The Android job only has to have finished, so that its APK is in the
    # draft before it is published: when it fails, or builds nothing for want
    # of the release key, the desktop installers go out without an APK, and
    # the failed run says so.
    needs: [prepare, publish-tauri, publish-android]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.publish-tauri.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publishing a draft creates the tag at the commit the draft points at,
      # and fires the `published` webhook the Discord bridge posts from.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          RELEASE="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          if [ "$(gh api "$RELEASE" --jq .draft)" != "true" ]; then
            echo "Already published; Discord was told the first time."
            exit 0
          fi
          TARGET=$(gh api "$RELEASE" --jq .target_commitish)
          if [ "$TARGET" != "$GITHUB_SHA" ]; then
            echo "::error::The release draft belongs to a different commit. Refusing to publish."
            exit 1
          fi
          gh api -X PATCH "$RELEASE" -F draft=false --jq .html_url
