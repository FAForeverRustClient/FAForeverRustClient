<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Open in the FAF client</title>
    <!--
      The https:// side of a faf:// link, for the places that only make https
      clickable (Discord). https://<host>/open/tourney/123, or /open/#tourney/123
      where the host cannot serve every path from this one file, opens
      faf://tourney/123 and offers the client's download when nothing answers.

      Only the six link kinds the client reads are passed on, each checked
      the way the client checks it (crates/faf-domain/src/protocol/deep_link.rs),
      so this page can never be made to open some other scheme. It loads
      nothing from anywhere else and stores nothing.
    -->
    <style>
      :root {
        color-scheme: dark light;
        --bg: #171718;
        --surface: #1f1f20;
        --border: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --muted: #a1a1aa;
        --accent: #d9ad57;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f7f7;
          --surface: #ffffff;
          --border: rgba(0, 0, 0, 0.12);
          --text: #18181b;
          --muted: #52525b;
          --accent: #7d5a10;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 440px;
        width: 100%;
        padding: 24px;
        box-sizing: border-box;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      code {
        overflow-wrap: anywhere;
        color: var(--text);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      a.button {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        text-decoration: none;
      }
      a.button.primary {
        border-color: var(--accent);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Opening the FAF client…</h1>
      <p id="what"></p>
      <p id="fallback" hidden>
        Nothing happened? The client may not be installed, or your browser asked first. Open the link
        again, or download the client.
      </p>
      <p id="invalid" hidden>This link does not point at anything the FAF client can show.</p>
      <div class="actions">
        <a id="open" class="button primary" hidden>Open in the client</a>
        <a class="button" href="https://github.com/FAForeverRustClient/FAForeverRustClient/releases/latest">
          Download the client
        </a>
      </div>
    </main>
    <script>
      (() => {
        const word = (max, extra) => (value) =>
          value.length > 0 && value.length <= max && [...value].every((c) => /[A-Za-z0-9]/.test(c) || extra.includes(c));
        const folder = (value) =>
          value.length > 0 && value.length <= 128 && value !== "." && value !== ".." &&
          !/[\u0000-\u001f\u007f/\\:*?"<>|]/.test(value);
        // The client's own rules, target by target.
        const TARGETS = {
          tourney: word(64, "-_"),
          tournament: word(64, "-_"),
          map: folder,
          mod: word(64, "-_."),
          replay: (value) => /^[0-9]{1,10}$/.test(value) && Number(value) > 0 && Number(value) <= 2147483647,
          changelog: word(32, ".-_"),
          units: word(16, "_"),
          unit: word(16, "_"),
        };
        const LABELS = {
          tourney: "a tournament",
          tournament: "a tournament",
          map: "a map",
          mod: "a mod",
          replay: "a replay",
          changelog: "a game patch",
          units: "a unit's history",
          unit: "a unit's history",
        };

        // /open/<target>/<value>, or the same after a # for hosts that serve
        // only this file.
        const fromPath = location.pathname.replace(/^.*?\/open\/?/, "");
        const raw = (location.hash.length > 1 ? location.hash.slice(1) : fromPath).replace(/\/$/, "");
        const slash = raw.indexOf("/");
        const target = (slash === -1 ? raw : raw.slice(0, slash)).toLowerCase();
        let value = "";
        try {
          value = decodeURIComponent(slash === -1 ? "" : raw.slice(slash + 1));
        } catch {
          value = "";
        }
        const check = Object.prototype.hasOwnProperty.call(TARGETS, target) ? TARGETS[target] : null;
        if (!check || !check(value)) {
          document.getElementById("title").textContent = "This link cannot be opened";
          document.getElementById("invalid").hidden = false;
          return;
        }

        const link = `faf://${target}/${encodeURIComponent(value)}`;
        const what = document.getElementById("what");
        what.append(`This link opens ${LABELS[target]} in the FAF client: `);
        const code = document.createElement("code");
        code.textContent = link;
        what.append(code);
        const open = document.getElementById("open");
        open.href = link;
        open.hidden = false;
        location.href = link;
        // A page that is still in front after a moment was not handed over.
        setTimeout(() => {
          if (document.visibilityState === "visible") document.getElementById("fallback").hidden = false;
        }, 1500);
      })();
    </script>
  </body>
</html>
