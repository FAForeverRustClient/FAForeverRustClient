[workspace]
resolver = "2"
members = ["crates/faf-domain", "crates/faf-app", "crates/faf-ipc", "src-tauri"]

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
tracing = "0.1"
faf-domain = { path = "crates/faf-domain" }
faf-app = { path = "crates/faf-app" }
